# sast-codeql — static application security testing.
#
# US-01.4.1 · T-01.4.1.3 — CodeQL over Java now; the javascript-typescript matrix
# entry joins when the Next.js frontend lands (EPIC-06). Weekly schedule catches
# newly-published query packs against unchanged code.

name: sast-codeql

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  schedule:
    - cron: '30 2 * * 1'   # Mondays 02:30 UTC

jobs:
  sast-codeql:
    name: sast-codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build for analysis
        working-directory: apps/vms-api
        # CodeQL builds its database by tracing a real compiler run, so this step must actually
        # compile. --no-build-cache is load-bearing: the repository enables the Gradle build cache,
        # and setup-gradle restores it, so on a pull request that touches no Java every task is
        # UP-TO-DATE, nothing is compiled, and analyze fails with "could not process any code
        # written in Java/Kotlin" — an empty database rather than a clean bill of health.
        run: ./gradlew classes --console=plain --no-build-cache --rerun-tasks
      - uses: github/codeql-action/analyze@v3
        with:
          category: java
