# ci — build, tests, coverage, dependency and secret gates.
#
# US-01.4.1 · T-01.4.1.1/2/3 — the Definition of Done as required status checks.
# Each job reports independently (AC-1). No retry-until-green anywhere (AC-5).
#
# SAST runs separately in codeql.yml (its own schedule + PR trigger).

name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

defaults:
  run:
    working-directory: apps/vms-api

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile all modules
        run: ./gradlew classes testClasses --console=plain

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests (everything except *IT)
        run: ./gradlew test -PunitOnly --console=plain
      - name: Publish results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'apps/vms-api/**/build/test-results/test/TEST-*.xml'
          check_name: unit-test-results

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Run integration tests (*IT — includes MigrationIT on embedded PostgreSQL)
        run: ./gradlew test -PitOnly --console=plain
      - name: Publish results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'apps/vms-api/**/build/test-results/test/TEST-*.xml'
          check_name: integration-test-results

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Aggregate coverage and enforce the reviewed baseline (AC-2)
        run: ./gradlew coverageGate --console=plain
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/vms-api/build/reports/jacoco/coverageReport/

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write   # dependency-submission writes the resolved graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # Resolve the real Gradle build and submit its dependency graph, so the
      # scan sees transitive deps. Without this, GitHub's graph is empty for
      # Gradle and any review passes vacuously (found while proving AC-3).
      - uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: apps/vms-api
      - name: Fail on new high/critical advisories (AC-3)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history (T-01.4.1.3)
      - name: gitleaks — findings reported redacted, never echoed (AC-4)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
