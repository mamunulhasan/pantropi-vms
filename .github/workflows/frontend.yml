# frontend — the portal's lint, type, token and build gates.
#
# UI-0 (F-06.1, ADR-0006) — runs on every PR that touches apps/vms-web. Four jobs' worth of
# checking in one job, because they share an install and none takes long:
#
#   lint         ESLint (Next.js config)
#   typecheck    tsc --noEmit — the typed token accessor makes an unknown token a compile error
#   check:tokens WCAG 2.1 AA contrast over every declared text pairing in styles/tokens.css
#                (US-06.1.1 AC-4); fails naming the tokens and the ratio
#   test         Vitest — the auth store's ACs (single-flight refresh, memory-only session,
#                logout ordering) and the next= redirect validator
#   build        next build — the artefact the portal image will ship
#
# The second job is the accessibility gate (UI-5, F-06.4): Playwright drives a production build
# with the API stubbed at the browser's network boundary, axe-core scans every route and both
# dialog states, and the job fails on any critical or serious WCAG 2.1 A/AA violation. It also
# carries the client-tamper check (T-06.3.2.3). Separate job because it needs a browser download
# and a built server, and because a red a11y gate should be readable without scrolling past lint.
#
# The visual-regression baseline (T-06.2.1.3) and the token-literal lint rule (T-06.1.1.3) remain
# deferred and are tracked in ADR-0006.

name: frontend

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/vms-web/**"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vms-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/vms-web/.nvmrc
          cache: npm
          cache-dependency-path: apps/vms-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Token contrast (WCAG 2.1 AA)
        run: npm run check:tokens

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  accessibility:
    name: accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vms-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/vms-web/.nvmrc
          cache: npm
          cache-dependency-path: apps/vms-web/package-lock.json

      - name: Install
        run: npm ci

      # Chromium only: the gate checks markup and ARIA, which do not vary by engine. A
      # cross-browser matrix would triple the runtime to re-answer the same question.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Accessibility scan and tamper check
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/vms-web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
