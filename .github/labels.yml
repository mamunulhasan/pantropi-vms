# ---------------------------------------------------------------- status
- name: "status/ready"
  color: "0E8A16"
  description: "Definition of Ready met — may be pulled into a sprint"
- name: "status/in-progress"
  color: "FBCA04"
  description: "Actively being worked"
- name: "status/blocked"
  color: "B60205"
  description: "Cannot proceed — see linked TODO or dependency"
- name: "status/in-review"
  color: "1D76DB"
  description: "PR open, awaiting review"
- name: "status/descope-candidate"
  color: "D4C5F9"
  description: "May be removed from scope pending a client decision"

# ---------------------------------------------------------------- blockers
- name: "needs-clarification"
  color: "FEF2C0"
  description: "Ambiguous requirement — client or vendor must answer before work starts"
- name: "blocked/acs-contract"
  color: "B60205"
  description: "Blocked on the UAL ACS API contract (TODO-02)"
- name: "blocked/srs-v2"
  color: "B60205"
  description: "Blocked on the missing SRS v2 (TODO-01)"
- name: "blocked/client-decision"
  color: "B60205"
  description: "Blocked awaiting a decision from CPG Corporation"
- name: "blocked/upstream"
  color: "B60205"
  description: "Blocked on another issue in this repository"

# ---------------------------------------------------------------- priority
- name: "priority/critical"
  color: "B60205"
  description: "Blocks the critical path"
- name: "priority/high"
  color: "D93F0B"
- name: "priority/medium"
  color: "FBCA04"
- name: "priority/low"
  color: "C2E0C6"

# ---------------------------------------------------------------- cross-cutting concerns
- name: "security"
  color: "D93F0B"
  description: "Security-relevant — requires security review before merge"
- name: "privacy/pii"
  color: "D93F0B"
  description: "Touches visitor personal data — data protection review required"
- name: "nfr"
  color: "5319E7"
  description: "Delivers or verifies a non-functional requirement"
- name: "documentation"
  color: "0075CA"
- name: "technical-debt"
  color: "EDEDED"
- name: "unbacked-by-srs"
  color: "B60205"
  description: "No SRS requirement backs this — must not be implemented (project rule 2)"

# ---------------------------------------------------------------- traceability
- name: "trace/verified"
  color: "0E8A16"
  description: "Traceability matrix row confirmed complete"
