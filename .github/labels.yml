# Label taxonomy — Project Pinnacle VMS
#
# Four required categories: Type · Priority · Status · Component
# Plus two project-specific sets: Provenance (traceability) and Blocker (dependency tracking).
#
# Apply with: scripts/bootstrap-github.sh   (requires the gh CLI)
# Documented in: docs/project/11-labels-and-project-board.md

# =====================================================================
# TYPE — what kind of work item this is (one per issue, required)
# =====================================================================
- name: "type/epic"
  color: "5319E7"
  description: "Epic — large body of work traceable to SRS requirements"
- name: "type/feature"
  color: "7B42BC"
  description: "Feature — independently deployable slice of an epic"
- name: "type/user-story"
  color: "0E8A16"
  description: "User story — the unit of work; only one implemented at a time"
- name: "type/task"
  color: "1D76DB"
  description: "Development task — concrete implementation work under a user story"
- name: "type/bug"
  color: "D73A4A"
  description: "Bug — delivered behaviour breaches a requirement"
- name: "type/spike"
  color: "FBCA04"
  description: "Spike — time-boxed investigation or clarification request"
- name: "type/enabler"
  color: "BFD4F2"
  description: "Enabler — technical work with no direct SRS requirement; needs justification"

# =====================================================================
# PRIORITY — delivery urgency (one per issue, required)
# =====================================================================
- name: "priority/P0-critical"
  color: "B60205"
  description: "P0 — blocks the phase or the critical path"
- name: "priority/P1-high"
  color: "D93F0B"
  description: "P1 — core requirement, needed for phase acceptance"
- name: "priority/P2-medium"
  color: "FBCA04"
  description: "P2 — required, but the phase can demo without it"
- name: "priority/P3-low"
  color: "C2E0C6"
  description: "P3 — deferrable to a later release"

# =====================================================================
# STATUS — board position (one per issue, required; mirrors the project board)
# =====================================================================
- name: "status/backlog"
  color: "EDEDED"
  description: "Backlog — not yet refined to Definition of Ready"
- name: "status/ready"
  color: "0E8A16"
  description: "Ready — Definition of Ready met, may be pulled into a sprint"
- name: "status/in-progress"
  color: "FBCA04"
  description: "In Progress — actively being worked"
- name: "status/code-review"
  color: "1D76DB"
  description: "Code Review — PR open, awaiting review"
- name: "status/testing"
  color: "5319E7"
  description: "Testing — merged, under QA verification"
- name: "status/ready-for-staging"
  color: "0052CC"
  description: "Ready for Staging — verified, awaiting staging deployment"
- name: "status/done"
  color: "0E8A16"
  description: "Done — Definition of Done met and accepted"
- name: "status/blocked"
  color: "B60205"
  description: "Blocked — cannot proceed; see the linked TODO or dependency"

# =====================================================================
# COMPONENT — architectural area (one or more per issue)
# Maps to TDD §4 services and the module layout in docs/project/09-repository-structure.md
# =====================================================================
- name: "component/platform"
  color: "BFDADC"
  description: "Build, CI/CD, infrastructure, deployment, observability"
- name: "component/identity"
  color: "C5DEF5"
  description: "Authentication, sessions, user management"
- name: "component/rbac"
  color: "C5DEF5"
  description: "Roles, permissions, authorization enforcement"
- name: "component/master-data"
  color: "C5DEF5"
  description: "Configuration & Master Data Service (TDD §4.1)"
- name: "component/visitor"
  color: "C5DEF5"
  description: "Visitor & Approval Service (TDD §4.2)"
- name: "component/credential"
  color: "C5DEF5"
  description: "Pass & Credential Service (TDD §4.3)"
- name: "component/entry"
  color: "C5DEF5"
  description: "Entry & ACS Operations Service (TDD §4.4)"
- name: "component/acs-integration"
  color: "E99695"
  description: "ACS Integration Client — the single ACS choke-point (TDD §6)"
- name: "component/card"
  color: "C5DEF5"
  description: "Card issuance, return and reconciliation"
- name: "component/notification"
  color: "C5DEF5"
  description: "Notification Service (TDD §8)"
- name: "component/reporting"
  color: "C5DEF5"
  description: "Reporting & Analytics Service (TDD §4.5)"
- name: "component/analytics"
  color: "C5DEF5"
  description: "Analytics dashboard and exports"
- name: "component/frontend"
  color: "BFDADC"
  description: "Web portal, reception UI, visitor-facing display"
- name: "component/database"
  color: "BFDADC"
  description: "Schema, migrations, data model"
- name: "component/audit"
  color: "C5DEF5"
  description: "Audit log, security, compliance"

# =====================================================================
# PROVENANCE — what authorises this work (one per issue; traceability control)
# =====================================================================
- name: "provenance/srs"
  color: "0E8A16"
  description: "Backed by a numbered SRS requirement — implementable"
- name: "provenance/tdd-derived"
  color: "FEF2C0"
  description: "From the TDD with no SRS requirement — BACKLOG ONLY pending TODO-01"
- name: "provenance/enabler"
  color: "BFD4F2"
  description: "Technical necessity justified against an NFR — implementable"
- name: "provenance/unbacked"
  color: "B60205"
  description: "No requirement backs this — must NOT be implemented (project rule 2)"

# =====================================================================
# BLOCKER — why something is blocked (dependency visibility)
# =====================================================================
- name: "blocked/srs-v2"
  color: "B60205"
  description: "Blocked on the missing SRS v2 (TODO-01)"
- name: "blocked/acs-contract"
  color: "B60205"
  description: "Blocked on the UAL ACS API contract (TODO-02)"
- name: "blocked/client-decision"
  color: "B60205"
  description: "Blocked awaiting a decision from CPG Corporation"
- name: "blocked/vendor-decision"
  color: "B60205"
  description: "Blocked awaiting a decision from Universal Automations Ltd"
- name: "blocked/upstream"
  color: "B60205"
  description: "Blocked on another issue in this repository"
- name: "needs-clarification"
  color: "FEF2C0"
  description: "Ambiguous requirement — must be answered before work starts"

