# Label taxonomy — Project Pinnacle VMS
# Apply with: scripts/bootstrap-github.sh (requires gh CLI)

# ---------------------------------------------------------------- type
- name: "type/epic"
  color: "5319E7"
  description: "Large body of work traceable to SRS requirements"
- name: "type/feature"
  color: "7B42BC"
  description: "Independently deployable slice of an epic"
- name: "type/user-story"
  color: "0E8A16"
  description: "Unit of work — only one implemented at a time"
- name: "type/task"
  color: "1D76DB"
  description: "Concrete implementation work under a user story"
- name: "type/bug"
  color: "D73A4A"
  description: "Delivered behaviour breaches a requirement"
- name: "type/spike"
  color: "FBCA04"
  description: "Time-boxed investigation or clarification request"
- name: "type/enabler"
  color: "BFD4F2"
  description: "Technical work with no direct SRS requirement — requires justification"

