// vms-bootstrap — the thin Spring Boot entry point. The ONLY module producing
// a runnable jar (T-01.2.1.1 acceptance). Owns wiring and profiles; owns no
// behaviour.
//
// US-01.2.1 · T-01.2.1.3

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':vms-infrastructure')
    implementation project(':vms-interfaces')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // US-01.5.1 — versioned migrations. JDBC + Flyway; no JPA yet.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Real PostgreSQL without Docker: Zonky embedded-postgres (US-01.5.1 ITs)
    testImplementation 'io.zonky.test:embedded-postgres:2.0.7'
}

// US-01.3.1: `./gradlew bootRun` starts the seeded local environment without further
// arguments. Any other environment sets SPRING_PROFILES_ACTIVE explicitly.
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active',
            providers.systemProperty('spring.profiles.active').getOrElse('local')
}
