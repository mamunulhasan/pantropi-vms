# Project Pinnacle VMS — base configuration (US-01.2.1 · T-01.2.1.3)
#
# Profiles: local · test · staging · prod (TDD §9.3 — containerised artifacts promoted
# unchanged; configuration injected per environment). Secrets NEVER live in these files —
# FR-API-03 (SRS B1): they arrive from the environment / secrets manager.

spring:
  application:
    name: vms-api
  # No default profile. 'local' is opt-in like staging and prod: it starts an embedded
  # database and seeds demo data, which must never be inherited silently by a test or a
  # deployment. `./gradlew bootRun` activates it explicitly (see vms-bootstrap/build.gradle).
  flyway:
    schemas: vms
    default-schema: vms
    clean-disabled: true       # forward-only, every profile (T-01.5.1.1)
    validate-on-migrate: true  # checksum tamper aborts startup (AC-5)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
