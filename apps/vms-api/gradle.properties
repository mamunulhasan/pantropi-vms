# Build performance. None of this changes what is built or tested — only how long it takes.
#
# The integration suite dominates the wall clock: 32 of the 33 *IT classes start their own
# EmbeddedPostgres, and before this they started one after another in a single fork.

# Modules that do not depend on each other build at the same time.
org.gradle.parallel=true

# Task outputs are reused when inputs are unchanged, across builds and branches. The suite is
# deterministic (no retry-until-green, AC-5), so a cached result means the same thing as a fresh one.
org.gradle.caching=true

# The default heap is small for a build that forks several test JVMs beside it.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m

# Gradle watches the filesystem instead of rescanning it each time.
org.gradle.vfs.watch=true

# Left off deliberately: the configuration cache does not survive the Spring Boot plugin's
# bootRun wiring here, and a build that has to be re-run with --no-configuration-cache is slower
# than one that never used it.
org.gradle.configuration-cache=false
