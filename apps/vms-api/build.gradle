// Project Pinnacle VMS — root build.
//
// US-01.2.1 · T-01.2.1.1 — Clean Architecture multi-module build.
//
// Dependency direction (enforced by the per-module dependency blocks below,
// and mechanically by the fitness tests of US-01.2.2):
//
//   interfaces ──┐
//                ├──► application ──► domain        domain depends on NOTHING
//   infrastructure ┘
//
// THE LOAD-BEARING RULE: vms-domain carries no Spring, no JPA, no framework
// of any kind on its compile classpath (AC-1, AC-5). A framework annotation
// in domain is a compile error, not a review comment.
//
// Requirement: NFR-MNT-01 (SRS B1), CON-01 (SRS B1), CON-02 (SRS B1)

plugins {
    id 'org.springframework.boot' version '3.3.4' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'jacoco'
}

repositories { mavenCentral() }   // for the root-level jacoco tooling

apply from: 'gradle/coverage.gradle'

// Self-contained dependency inventory for the OSV scan (US-01.4.1 AC-3).
// Resolves every module's runtimeClasspath and writes the full transitive set as
// Maven coordinates to build/reports/dependencies.txt, which scripts/dependency-scan.py
// checks against the OSV vulnerability database. No third-party plugin, no GitHub graph.
tasks.register('dependencyInventory') {
    def outFile = file("${rootDir}/build/reports/dependencies.txt")
    def projects = subprojects
    doLast {
        def coords = [] as Set
        projects.each { sp ->
            def cfg = sp.configurations.findByName('runtimeClasspath')
            if (cfg && cfg.canBeResolved) {
                cfg.resolvedConfiguration.resolvedArtifacts.each { a ->
                    def id = a.moduleVersion.id
                    coords << "${id.group}:${id.name}:${id.version}".toString()
                }
            }
        }
        outFile.parentFile.mkdirs()
        def nl = System.lineSeparator()
        outFile.text = coords.sort().join(nl) + nl
        println "dependencyInventory: ${coords.size()} unique dependencies -> ${outFile}"

    }
}

// Full dependency scan (US-01.4.1 T-01.4.1.3, AC-3): inventory -> OSV check.
// Runs locally and in CI, needs neither a scanner binary nor GitHub's dependency graph.
tasks.register('dependencyScan', Exec) {
    dependsOn 'dependencyInventory'
    workingDir rootDir.parentFile.parentFile   // repo root
    def py = System.getProperty('os.name').toLowerCase().contains('win') ? 'python' : 'python3'
    commandLine py, 'scripts/dependency-scan.py',
            "${rootDir}/build/reports/dependencies.txt", '--fail-on', 'high'
}

// Aggregated coverage across all modules + the gate (US-01.4.1 T-01.4.1.2).
// Run:  ./gradlew coverageReport coverageGate
tasks.register('coverageReport', JacocoReport) {
    dependsOn subprojects.collect { it.tasks.named('test') }
    dependsOn subprojects.collect { it.tasks.named('jacocoTestReport') }
    executionData fileTree(rootDir) { include '**/build/jacoco/test.exec' }
    classDirectories.setFrom(files(subprojects.collect { sp ->
        sp.fileTree("${sp.buildDir}/classes/java/main") { exclude coverageExclusions }
    }))
    sourceDirectories.setFrom(files(subprojects.collect { "${it.projectDir}/src/main/java" }))
    reports { xml.required = true; html.required = true }
}

tasks.register('coverageGate', JacocoCoverageVerification) {
    dependsOn tasks.named('coverageReport')
    executionData fileTree(rootDir) { include '**/build/jacoco/test.exec' }
    classDirectories.setFrom(files(subprojects.collect { sp ->
        sp.fileTree("${sp.buildDir}/classes/java/main") { exclude coverageExclusions }
    }))
    sourceDirectories.setFrom(files(subprojects.collect { "${it.projectDir}/src/main/java" }))
    violationRules {
        rule {
            limit { counter = 'LINE';   value = 'COVEREDRATIO'; minimum = coverageMinimumLine }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = coverageMinimumBranch }
        }
    }
}

subprojects {
    apply plugin: 'java-library'   // provides api() for inward module dependencies

    group = 'com.pantropi.vms'
    version = '0.1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // Emit method parameter names so Spring MVC can bind @RequestParam/@PathVariable
    // without explicit names (the spring-boot plugin adds this; our plain modules need it).
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.assertj:assertj-core:3.26.3'
    }

    test {
        useJUnitPlatform()
        testLogging { events 'failed', 'skipped' }
        // CI split (US-01.4.1): -PunitOnly runs everything except *IT;
        // -PitOnly runs only *IT. No property = full suite (local default).
        if (project.hasProperty('unitOnly'))  { exclude '**/*IT.class' }
        if (project.hasProperty('itOnly'))    { include '**/*IT.class' }

        // Half the cores. The integration suite is the wall clock — 32 of the 33 *IT classes
        // start their own EmbeddedPostgres, and run one after another they simply queue. Each
        // fork carries a Postgres and a Spring context, so half is the point where more forks
        // stop buying time and start buying swap; the value is capped so a bigger CI runner does
        // not quietly try to hold sixteen databases at once.
        maxParallelForks = Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)))

        // AC-5: no retry-until-green, ever.
    }

    apply plugin: 'jacoco'
    jacoco { toolVersion = '0.8.12' }
    test.finalizedBy tasks.named('jacocoTestReport')
    jacocoTestReport {
        dependsOn test
        reports { xml.required = true; html.required = true }
    }
}
