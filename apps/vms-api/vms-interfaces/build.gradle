// vms-interfaces — inbound edges: REST controllers, schedulers, event
// listeners. Depends inward on application (use cases), transitively domain.
// Carries Spring Web MVC annotations; carries NO business logic.
//
// US-01.2.1 · T-01.2.1.1

plugins {
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

dependencies {
    api project(':vms-application')
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-webmvc'       // US-02.1.1 controller + interceptor
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    // servlet API for the interceptor — sourced from cached tomcat-embed-core (offline; Maven 403)
    compileOnly('org.apache.tomcat.embed:tomcat-embed-core') { transitive = false }
}
