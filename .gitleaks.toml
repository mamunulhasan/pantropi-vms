# gitleaks configuration — secret scanning (US-01.4.1, T-01.4.1.3)
#
# The default ruleset is kept in full and extended, never replaced: this file
# only narrows false positives, it must never widen what the scanner ignores.
#
# Rule for changing this file: allowlist a specific known-fake LITERAL, never a
# path. `paths` would exempt whole directories and blind the scanner to a real
# credential committed there, which is precisely the failure this check exists
# to prevent. A literal this specific cannot match a real secret.

[extend]
useDefault = true

[allowlist]
description = "Fixed non-secret JWT signing key used by the integration tests"

# The JWT signing key used by the integration tests. It is a fixed, published,
# deliberately worthless string that exists so a test can sign and verify a
# token against an ephemeral database; it authenticates nothing. Real
# deployments read vms.security.jwt.secret from the environment, and the
# application ships no default for it outside the local profile.
#
# Matched against the detected secret itself (gitleaks' default regexTarget),
# so this exempts exactly this one value and nothing else — anywhere in the
# tree, in any file, a different secret still fails the build.
regexes = ['''integration-test-secret-least-32-bytes-long-xx''']
